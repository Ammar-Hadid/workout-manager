      <stop offset="0" stop-color="#111d31"/>
      <stop offset=".48" stop-color="#091426"/>
      <stop offset="1" stop-color="#020711"/>
    </linearGradient>
    <linearGradient id="letter" x1="178" y1="105" x2="292" y2="398" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".52" stop-color="#f1f4f9"/>
      <stop offset="1" stop-color="#dce2eb"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="205" y1="389" x2="338" y2="302" gradientUnits="userSpaceOnUse">
