<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Auctus logo</title>
  <desc id="description">A stylized white letter A with a blue rising accent on a dark rounded square.</desc>

  <defs>
